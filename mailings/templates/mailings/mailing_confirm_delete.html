<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить рассылку</title>
</head>
<body>
    <h1>Удалить рассылку</h1>
    <p>Вы уверены, что хотите удалить рассылку с {{ object.start_time }} по {{ object.end_time }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'mailings:mailing_list' %}">Отмена</a>
    </form>
</body>
</html>
