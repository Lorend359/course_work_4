<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
</head>
<body>
    <h1>Главная</h1>

    {% if user.is_authenticated %}
        <p>Вы вошли как: <strong>{{ user.email }}</strong></p>
    {% else %}
        <p>Вы не вошли в систему.</p>
    {% endif %}

    <p>Всего рассылок: <strong>{{ total_mailings }}</strong></p>
    <p>Активных рассылок: <strong>{{ active_mailings }}</strong></p>
    <p>Уникальных получателей: <strong>{{ unique_clients }}</strong></p>

    <hr>
    <p>
        <a href="{% url 'mailings:client_list' %}">Клиенты</a> |
        <a href="{% url 'mailings:message_list' %}">Сообщения</a> |
        <a href="{% url 'mailings:mailing_list' %}">Рассылки</a> |
        <a href="{% url 'mailings:attempt_list' %}">Попытки</a>
    </p>
</body>
</html>
