{% extends "base.html" %}

{% block title %}Добавить клиента{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-3">Добавить клиента</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary ms-2">← Назад к списку</a>
    </form>
</div>
{% endblock %}
