{% extends "base.html" %}

{% block title %}{{ view.object.pk|yesno:"Редактировать сообщение,Создать сообщение" }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{{ view.object.pk|yesno:"Редактировать сообщение,Создать сообщение" }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">← Назад</a>
    </form>
</div>
{% endblock %}
