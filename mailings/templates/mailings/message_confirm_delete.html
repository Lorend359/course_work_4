{% extends "base.html" %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Удалить сообщение</h1>
    <p>Вы уверены, что хотите удалить сообщение: <strong>{{ object.subject }}</strong>?</p>

    <form method="post" class="mb-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
