<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить сообщение</title>
</head>
<body>
    <h1>Удалить сообщение</h1>
    <p>Вы уверены, что хотите удалить сообщение: <strong>{{ object.subject }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'mailings:message_list' %}">Отмена</a>
    </form>
</body>
</html>
