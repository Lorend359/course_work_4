{% extends "base.html" %}

{% block title %}{% if view.object %}Редактировать{% else %}Создать{% endif %} рассылку{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{% if view.object %}Редактировать{% else %}Создать{% endif %} рассылку</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailings:mailing_list' %}" class="btn btn-secondary">← Назад</a>
    </form>
</div>
{% endblock %}
