{% extends "base.html" %}

{% block title %}Удалить клиента{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-3">Удалить клиента</h1>
    <p>Вы уверены, что хотите удалить клиента: <strong>{{ object.full_name }}</strong>?</p>

    <form method="post" class="mb-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
{% endblock %}
