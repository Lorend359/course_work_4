<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить клиента</title>
</head>
<body>
    <h1>Удалить клиента</h1>
    <p>Вы уверены, что хотите удалить клиента: <strong>{{ object.full_name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'mailings:client_list' %}">Отмена</a>
    </form>
</body>
</html>
